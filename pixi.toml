[workspace]
name = "llm-pcb"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
numpy = "*"
scipy = "*"
shapely = ">=2"
networkx = "*"
pydantic = ">=2"
pyyaml = "*"
pytest = "*"
pymupdf = "*"
pillow = "*"
openjdk = ">=25"

[pypi-dependencies]
mcp = "*"
kicad-python = "*"
llm-pcb = { path = ".", editable = true }

[tasks]
test = "bash -c 'source tools/env.sh && pytest -q tests'"
server = "bash -c 'source tools/env.sh && python -m llmpcb.server'"
