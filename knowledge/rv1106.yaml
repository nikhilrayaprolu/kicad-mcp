    sensor_side_pins: {MCLK: "pin 2 MIPI_CLK0_OUT (GPIO3_C4) via R30 22R -> MIPI/LVDS_MCLK0", reset: "pin 3 GPIO3_C5 -> MIPI/LVDS_RST", i2c_scl: "pin 5 I2C4_SCL_M2 (GPIO3_C7)", i2c_sda: "pin 7 I2C4_SDA_M2 (GPIO3_D0)", i2c_pullups: "R28/R29 4.7K to VCC_1V8"}
