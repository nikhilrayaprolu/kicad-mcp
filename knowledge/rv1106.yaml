# Rockchip RV1106G2 / RV1106G3 knowledge file (QFN128 + exposed pad, in-package DDR3L)
# All `src:` paths are relative to knowledge/sources/. Page numbers are PDF page numbers
# (for the datasheet they equal the printed page numbers).
#   DS   = Rockchip_RV1106_Datasheet_V2.2-20260602.pdf   (Rockchip, Rev 2.2, 2026-06-02; from LuckfoxTECH/Luckfox-Pico-docs)
#   DS17 = RV1106_Datasheet_V1.7.pdf                      (Rev 1.7, files.luckfox.com; older, pins 105/110/117-128 renamed since)
#   SCH  = Luckfox-Pico-Pro-Max.pdf                       (Luckfox Pico Pro/Max schematic, 1 page; symbol text says "RV1106G2";
#                                                          Pro = RV1106G2 (1Gb DDR3L), Max = RV1106G3 (2Gb DDR3L), same QFN128 pinout)
#   UW   = Luckfox-Pico-Ultra-W.pdf                       (Luckfox Pico Ultra/Ultra-W schematic; RV1106G2/G3, eMMC; used as cross-check)
# Schematic coordinates "@x,y" are PDF points on page 1 (842x595 pt sheet) to help find the spot when re-reading.
# Rules: never invent pin numbers. Everything in `pins:` is machine-extracted from DS Table 2-1 (scripts/gen_pins_yaml.py).

part:
  family: RV1106
  preferred_variant: RV1106G3
  variants:
    - {name: RV1106G2, memory: "SIP 1Gb DDR3L, 16-bit", package: QFN128, src: "Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p16", src2: "Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p7"}
    - {name: RV1106G3, memory: "SIP 2Gb DDR3L, 16-bit", package: QFN128, src: "Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p16", src2: "Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p7"}
    - {name: RV1106,   memory: "external DDR2/DDR3/DDR3L/DDR4", package: BGA313, note: "different package; NOT covered by this file", src: "Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p16"}
  same_pinout_G2_G3: true   # DS Table 2-1 is titled "Pin Number Order Information for RK1106G2 & G3"; src: Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p21
  cpu: "single Cortex-A7 (+ RISC-V MCU), 1.0 TOPS NPU"   # src: Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p16 (order info), Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p7
  ddr_note: >-
    DDR3L die is inside the package. No DDR data/address pins are exposed on QFN128; the only DDR-related
    pins are DDR_VDDQ_1..3 (49,50,56), DDR_PLL_AVDD1V8 (53) and DRAM_ZQ (52). Hence no pin is typed ddr_internal.
  src: "Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p21"

package:
  name: QFN128 (exposed pad)          # src: Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p15, Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p16
  pin_count: 128                      # + exposed pad = 129 pads; src: Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p18 (bottom view 1..128), Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p22
  body_size_mm: [12.3, 12.3]          # D x E BSC; src: Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p19 (Fig.2-7)
  pitch_mm: 0.35                      # e BSC; src: Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p19
  height_mm: {min: 0.80, nom: 0.85, max: 0.90}     # A; src: Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p19
  standoff_mm: {min: 0.0, nom: 0.02, max: 0.05}    # A1; src: Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p19
  lead_width_b_mm: {min: 0.08, nom: 0.13, max: 0.18}   # src: Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p19
  lead_length_L_mm: {min: 0.30, nom: 0.40, max: 0.50}  # src: Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p19
  lead_tip_to_ep_edge_K_mm: 2.25      # REF; src: Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p19
  leadframe_thickness_A3_mm: 0.152    # REF; src: Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p19
  exposed_pad_mm: {x: {min: 6.9, nom: 7.0, max: 7.1}, y: {min: 6.9, nom: 7.0, max: 7.1}}   # D2/E2; src: Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p19
  exposed_pad_connects_to: VSS (ground)   # DS lists "VSS  E-PAD"; src: Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p22. SCH draws it as U1D pin 129 "ePAD" -> GND (Luckfox-Pico-Pro-Max.pdf#p1 @264,500)
  exposed_pad_number_in_reference_symbol: 129   # Luckfox symbol numbering, not a datasheet number; src: Luckfox-Pico-Pro-Max.pdf#p1
  tolerances_mm: {aaa_package_edge: 0.1, ccc_mold_flatness: 0.1, eee_coplanarity: 0.08, bbb_lead_offset: 0.07, fff_ep_offset: 0.1}  # src: Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p19
  pin_numbering: >-
    Standard QFN counter-clockwise (top view): pin 1 at the pin-1 corner dot (top-left in top view), pins 1-32 down the
    left side, 33-64 along the bottom, 65-96 up the right side, 97-128 along the top (bottom view on Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p18 shows
    1 / 32 / 33 / 64 / 65 / 96 / 97 / 128 at the corners, mirrored).
  src: "Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p17-19"
  msl: 3                               # src: Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p21
  lead_finish: Sn                      # src: Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p21
  thermal: {theta_ja_C_per_W: 27.3, theta_jb_C_per_W: 12.5, theta_jc_C_per_W: 8.4, board: "JEDEC 2S2P 4-layer", src: "Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p31"}
  tj_max_C: 125                        # src: Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p26
  ambient_operating_C: [-20, 85]       # src: Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p27
  footprint_note: >-
    Datasheet gives no recommended land pattern; derive an IPC-7351 footprint from the dimensions above.
    0.35 mm pitch with 0.13 mm leads -> needs fine-pitch fab capability (pad ~0.18-0.2 mm wide).
  unverified_footprint: true

# ---------------------------------------------------------------------------------------------------------------
power_rails:
  # Nominal/limits from DS Table 3-2 (p26-27); abs max from Table 3-1 (p26). Reference implementation = SCH (Luckfox Pico Pro/Max).
  VDD_CPU:
    pins: [115]                      # CPU_DVDD
    nominal_V: 0.90
    range_V: [0.85, 1.05]           # src: Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p26
    abs_max_V: 1.15                  # src: Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p26
    reference: >-
      Net VDD_ARM. Fed from VDD_0V9 through R32 0R (SCH@318,24). The Pro/Max sheet prints "DNP" in R32's fields,
      but there is no other source for VDD_ARM on the sheet; the Ultra-W sheet does the same with R10 0R (no DNP).
      So in practice CPU_DVDD is tied to the 0.9 V logic rail. pin 74 (CPU_AVS/GPIO1_A2) is net AVS_ARM, but in the
      reference it goes nowhere else (no AVS regulator).
    decoupling_reference: ["C15 10uF", "C16 1uF", "C17 100nF"]   # "For ARM", "Close to Power Pin"; src: Luckfox-Pico-Pro-Max.pdf#p1 @229-261,558-572
    src: "Luckfox-Pico-Pro-Max.pdf#p1"
    unverified: true                 # because of the DNP text on R32
  VDD_LOGIC:
    pins: [10, 51, 54, 55, 82, 103, 116, 67, 71]   # DVDD_1..7, PMU_DVDD0V9 (67), OSC_PLL_DVDD (71)
    nominal_V: 0.90
    range_V: [0.81, 0.95]           # DVDD_i and PMU_DVDD0V9; src: Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p26
    abs_max_V: 0.99
    note: >-
      DS Table 3-2 does not list OSC_PLL_DVDD separately (Table 3-1 groups it with the 0.9 V supplies).
      SCH ties DVDD_1..7 + PLL_DVDD0V9 (pin 71) to VDD_0V9, and PMU_DVDD0V9 (pin 67) to VDD_0V9 with C36 100nF.
    reference_regulator: >-
      U4 sync buck, VCC5V0_SYS -> VDD_0V9; L2 1.0uH 2016 4.7A 32mOhm; FB divider R33 47K 1% / R37 100K 1%
      (=> 0.6 V reference -> ~0.88 V); C49 20pF feed-forward; Cin C51 4.7uF; Cout C52 22uF + C53 100nF + C1 4.7uF;
      EN pulled to VIN by R35 10K (C57 NC). Sheet title "VCC5V0_SYS--->VDD_0V9  Setp 1".
      Package is a 6-pin device with pins 1 FB, 2 GND, 3 Vin, 4 SW, 5 EN, 6 Vout; NO part number is printed on the sheet.
    decoupling_reference: ["C22 10uF", "C23 10uF", "C24 1uF", "C25 1uF", "C26 100nF", "C27 100nF", "C28 100nF", "C36 100nF (pin 67)"]  # "For LOGIC/NPU/VEPU"
    src: "Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p26; Luckfox-Pico-Pro-Max.pdf#p1 @222-335,6-64 and @310-382,556-572"
    regulator_part_number: unknown
    unverified: true                 # FB reference 0.6 V inferred from the divider ratio vs. labelled rail voltage
  VCC_DDR:
    pins: [49, 50, 56]               # DDR_VDDQ_1..3 (DS abs-max table mentions DDR_VDDQ_4, which only exists on the BGA part)
    nominal_V: 1.35                  # in-package memory is DDR3L
    range_V: [1.283, 1.45]           # DDR3L VDDQ; src: Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p26
    abs_max_V: 1.94
    reference_regulator: >-
      U7 buck (same 6-pin footprint as U4), VCC5V0_SYS -> VCC_DDR; L4 1.0uH 2016 4.7A; FB R13 127K 1% / R17 100K 1% (~1.36 V);
      C2 20pF FF; Cout C75 10uF + C76 100nF. EN net VCC_DDR_1V8_EN = R14 200K from VCC5V0_SYS + C77 100nF to GND (RC soft delay).
    decoupling_reference: ["C18 10uF", "C19 10uF", "C20 1uF", "C21 100nF"]   # "For DDR"
    src: "Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p26; Luckfox-Pico-Pro-Max.pdf#p1 @440-556,6-64 and @263-304,558-572"
    regulator_part_number: unknown
  VCC_1V8 (analog/IO 1.8 V):
    pins: [70, 96, 53, 24, 31, 1]
    members:
      - {pin: 70, name: "OSC_AVDD1V8/PLL_AVDD1V8", range_V: [1.62, 1.98], reference: "VCC_1V8 via FB3 UPZ1005D121-1R3TF ferrite, C31 100nF + C32 100nF; shared with pin 96", src: "Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p26; Luckfox-Pico-Pro-Max.pdf#p1 @342-377,147-161"}
      - {pin: 96, name: "OTP_AVDD1V8/ETH_AVDD1V8/TSADC_AVDD1V8", range_V: [1.62, 1.98], reference: "same net as pin 70 (after FB3)", src: "Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p26; Luckfox-Pico-Pro-Max.pdf#p1"}
      - {pin: 53, name: "DDR_PLL_AVDD1V8", nominal_V: 1.8, reference: "VCC_1V8 direct; C11 1uF + C12 100nF 'For AVDD18_DDR'", src: "Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p27; Luckfox-Pico-Pro-Max.pdf#p1 @385-405,556-570"}
      - {pin: 24, name: "SARADC_USB_AVDD1V8", range_V: [1.62, 1.98], reference: "net AVDD1V8_USB = VCC_1V8 via R8 0R, C10 100nF. Also supplies the SARADC IO domain (VCCIO2). Sheet note: 'USB must always power supply'", src: "Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p26; Luckfox-Pico-Pro-Max.pdf#p1 @296-350,524-538"}
      - {pin: 31, name: "CODEC_AVDD1V8", range_V: [1.62, 1.98], reference: "net VCC1V8_CODEC = VCC_1V8 via FB2 UPZ1005D121-1R3TF (120R@100MHz); C13 10uF + C14 100nF", src: "Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p27; Luckfox-Pico-Pro-Max.pdf#p1 @409-457,556-570"}
      - {pin: 1, name: "MIPI_AVDD1V8/GPIO7_VCC1V8", range_V: [1.62, 1.98], reference: "net MIPI_CSI_AVDD_1V8 = VCC_1V8 via R31 1R, C45 100nF. 1.8 V only; also the VCCIO7 IO domain (MIPI/DVP pins 2-9,117-128)", src: "Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p26-27; Luckfox-Pico-Pro-Max.pdf#p1 @388-427,422-432"}
    reference_regulator: >-
      U5 buck (same 6-pin footprint), VCC5V0_SYS -> VCC_1V8; L1 1.0uH 2016 4.7A; FB R34 200K 1% / R38 100K 1% (1.8 V);
      C50 20pF FF; Cout C55 10uF + C56 100nF. EN = net VCC_DDR_1V8_EN (shared with U7; its own R36 NC/200K, C58 NC/100nF).
      Optional FB4 (NC/0R) can tie VCC_1V8 to VCC_DDR (C46 4.7uF, C47 100nF, C48 1uF) - left unfitted.
    src: "Luckfox-Pico-Pro-Max.pdf#p1 @335-440,6-64 and @556-622,6-64"
    regulator_part_number: unknown
  VCC_3V3:
    pins: [61, 81, 19, 28, 101, 13, 43, 88, 108]
    members:
      - {pin: 61, name: PMU_VCC3V3, range_V: [3.0, 3.465], note: "3.3 V only; PMUIO domain (GPIO0, pins 58-65)", reference: "VCC_3V3, C37 100nF", src: "Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p26; Luckfox-Pico-Pro-Max.pdf#p1"}
      - {pin: 81, name: GPIO1_VCC3V3, range_V: [3.0, 3.465], note: "3.3 V only; VCCIO1 domain (pins 72-80)", reference: "VCC_3V3, C39 100nF", src: "Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p26; Luckfox-Pico-Pro-Max.pdf#p1"}
      - {pin: 19, name: RTC_AVDD3V3, range_V: [1.6, 3.6], reference: "VCC3V3_RTC via R11 100R, C35 1uF; VCC3V3_RTC = diode-OR (B5819WS D2 from RTC battery header H2, D3 from VCC_3V3; R45 NC/1.1K)", src: "Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p26; Luckfox-Pico-Pro-Max.pdf#p1 @344-357,172-184 and @445-535,500-545"}
      - {pin: 28, name: USB_AVDD3V3, range_V: [3.0, 3.6], reference: "VCC_3V3 direct, C9 100nF", src: "Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p26; Luckfox-Pico-Pro-Max.pdf#p1"}
      - {pin: 101, name: ETH_AVDD3V3, range_V: [2.97, 3.63], reference: "net FEPHY_AVDD3V3 = VCC_3V3 via FB1 (UPZ1005D121-1R3TF / BLM15PD121SN1 printed), C8 100nF", src: "Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p26; Luckfox-Pico-Pro-Max.pdf#p1 @230-254,526-538"}
      - {pin: 13, name: GPIO4_VCC, range_V_3v3: [3.0, 3.465], range_V_1v8: [1.62, 1.98], note: "VCCIO4 = SDMMC0 domain (pins 11,12,14-18)", reference: "VCC_3V3, C41 100nF", src: "Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p26; Luckfox-Pico-Pro-Max.pdf#p1"}
      - {pin: 43, name: GPIO3_VCC, note: "VCCIO3 = EMMC/FSPI domain (pins 38-42,44-48)", reference: "net VCCIO_FLASH = VCC_3V3, C40 100nF (+C42 10uF/C43 100nF at flash)", src: "Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p26; Luckfox-Pico-Pro-Max.pdf#p1"}
      - {pin: 88, name: GPIO6_VCC, note: "VCCIO6 domain (pins 83-87,89-95)", reference: "VCC_3V3", src: "Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p26; Luckfox-Pico-Pro-Max.pdf#p1"}
      - {pin: 108, name: GPIO5_VCC, note: "VCCIO5 domain (pins 104-107,109-114)", reference: "VCC_3V3", src: "Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p26; Luckfox-Pico-Pro-Max.pdf#p1"}
    reference_regulator: >-
      U6 buck with bootstrap (pins 1 Vin, 2 SW, 3 GND, 4 BST, 5 EN, 6 FB), VCC5V0_SYS -> VCC_3V3; L3 2.2uH 2520;
      R39 10R + C59 1uF bootstrap; FB R40 40.2K 1% / R44 13K 1% with "FB1:0.8V" (=> 3.27 V); C62 10pF FF;
      Cin C60 10uF + C61 100nF; Cout C63 10uF + C64 100nF. EN: R43 200K from net PWR_EN (header pin "3V3_En" via 0R),
      C65 100nF to GND, R41 "1K/NC" from VIN. NO part number printed.
    src: "Luckfox-Pico-Pro-Max.pdf#p1 @460-622,62-118"
    regulator_part_number: unknown
  VCC5V0_SYS (board input):
    reference: >-
      USB-C VBUS (Type_C1) -> D1 MBR230LSFT1G Schottky -> VSYS = VCC5V0_SYS; C5 10uF + C6 100nF. CC1/CC2 each 5.1K (R3, R6)
      to GND (sink/UFP). C4 2.2uF on VBUS.
    src: "Luckfox-Pico-Pro-Max.pdf#p1 @365-450,440-545"
  ground:
    pins: [57, 37, "EP"]
    note: >-
      EP = VSS. TVSS (57) tied directly to GND in SCH. CODEC_AVSS (37) -> GND through R4 0R, note
      "Place R1001 close to Pin37" (SCH@314,503).
    src: "Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p22; Luckfox-Pico-Pro-Max.pdf#p1"
  usb_always_powered: {note: "SCH note next to USB_AVDD pins: 'USB must always power supply' -> supply pins 24 and 28 even if USB is unused", src: "Luckfox-Pico-Pro-Max.pdf#p1 @292,524"}
  sequencing:
    datasheet: "DS Rev 2.2 contains no power-up sequence requirement (none found in text)."
    reference_order: >-
      Luckfox SCH labels the VDD_0V9 buck "Setp 1" (EN pulled up with 10K, no cap -> starts first); VCC_DDR and VCC_1V8 share
      enable net VCC_DDR_1V8_EN with 200K/100nF RC delay (Ultra-W labels this block "VCC_DDR--->VCC_1V8 Setp 2");
      VCC_3V3 EN via 200K/100nF from PWR_EN. Practical order: 0.9 V -> 1.35 V/1.8 V -> 3.3 V.
    reset: "nPOR (pin 66) pulled up to VCC_3V3 by R12 1K with C38 10nF to GND (RC power-on reset); reset key Key1 via R22 100R."
    src: "Luckfox-Pico-Pro-Max.pdf#p1 @222-556,6-64; Luckfox-Pico-Ultra-W.pdf#p1 @585-745,205-305; Luckfox-Pico-Pro-Max.pdf#p1 @445-535,180-230"
    unverified: true    # Rockchip's own sequencing rule is in the (non-public here) hardware design guide

# ---------------------------------------------------------------------------------------------------------------
interfaces:
  crystal_24MHz:
    pins: {OSC_XIN: 68, OSC_XOUT: 69}              # src: Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p21
    reference: >-
      Y1 24 MHz passive crystal, 2016 4-pad (X1=pin1 to OSC_XIN, X2=pin3 to OSC_XOUT via R9 22R series, pads 2/4 GND);
      R10 1M across XIN/XOUT; load caps C29 18pF and C30 18pF C0G to GND.
    src: "Luckfox-Pico-Pro-Max.pdf#p1 @357-412,127-138"
  crystal_32k_rtc:
    pins: {RTC_XIN: 21, RTC_XOUT: 20}               # src: Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p21-22
    reference: "Y2 32.768 kHz passive crystal 2012; C33 18pF, C34 18pF C0G. Optional (RTC)."
    src: "Luckfox-Pico-Pro-Max.pdf#p1 @388-412,161-177"
  reset:
    pins: {nPOR: 66}                                # src: Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p21
    reference: "Active-low. R12 1K pull-up to VCC_3V3, C38 10nF to GND; Key1 to GND via R22 100R; ED1 ESD (NC/ESD5451N)."
    src: "Luckfox-Pico-Pro-Max.pdf#p1 @406,224 (R12/C38) and @530-622,400-440 (Key1)"
  recovery_maskrom:
    pins: {SARADC_IN0: 23}
    reference: >-
      Net RECOVERY on SARADC_IN0 (pin 23): R21 10K pull-up to VCC_1V8, C44 1nF to GND, Key2 ("RECOVERY Key") to GND via
      R23 100R (ED2 ESD NC). Holding it low at power-up is the BOOT/recovery button.
    behaviour: >-
      Rockchip convention: SARADC_IN0 low at boot -> loader/maskrom (USB download via rkdeveloptool/upgrade_tool on USB OTG).
      Not stated in the datasheet; DS only says BootROM boots from SPI flash, eMMC, SD/MMC and downloads over USB or UART (Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p7).
      With blank/absent flash the BootROM also falls through to USB download.
    src: "Luckfox-Pico-Pro-Max.pdf#p1 @445-535,365-440; Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p7"
    unverified: true
  fspi_spi_nand:
    pins: {FSPI_CLK: 48, FSPI_CS0: 47, FSPI_D0: 41, FSPI_D1: 42, FSPI_D2: 44, FSPI_D3: 39}   # src: Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p22
    io_domain: "VCCIO3 = pin 43 GPIO3_VCC (VCCIO_FLASH = 3.3 V in reference)"
    reference: >-
      U2 Winbond W25N02KVZEIR (2Gb SPI NAND, WSON-8 + EPAD): pin1 /CS=FSPI_CS0N, 2 DO(IO1)=FSPI_D1, 3 /WP(IO2)=FSPI_D2,
      4 VSS, 5 DI(IO0)=FSPI_D0, 6 CLK=FSPI_CLK, 7 /HOLD(IO3)=FSPI_D3, 8 VCC=VCCIO_FLASH, 9 EPAD=GND.
      FSPI_CLK has R15 22R series resistor at the SoC. R18 10K pull-up on FSPI_D2, R19 10K pull-up on FSPI_D3 (to VCCIO_FLASH).
      VCCIO_FLASH decoupling C42 10uF + C43 100nF.
    note: "Same pins are EMMC_* (eMMC boot, 8-bit uses pins 38-48); Ultra/Ultra-W use eMMC instead of SPI NAND."
    src: "Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p22; Luckfox-Pico-Pro-Max.pdf#p1 @445-535,270-372 and @560-610,155-205"
  sdmmc0_microsd:
