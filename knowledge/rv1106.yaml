  usb2_otg:
    pins: {USB_DP: 27, USB_DM: 26, USB_VBUSDET: 25}   # src: Rockchip_RV1106_Datasheet_V2.2-20260602.pdf#p22
    supplies: {USB_AVDD3V3: 28, SARADC_USB_AVDD1V8: 24}
    id_pin: "None on QFN128 (no USB_ID in DS Table 2-1); host/device role is set in software."
    external_resistors: "None on the QFN part: there is no USB reference-resistor pin."
    reference: >-
      USB-C receptacle (device): DP1/DP2 -> USB_P, DN1/DN2 -> USB_N straight to pins 27/26 (90-ohm diff).
      VBUS detect: USB_DET_IN = VBUS divided by R2 10K (top) / R5 18K (bottom) (~3.2 V at 5 V) + C7 100nF -> pin 25.
      CC1/CC2: R3 / R6 5.1K to GND.
