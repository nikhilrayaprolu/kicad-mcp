    io_domain: "VCCIO4 = pin 13 GPIO4_VCC (3.3 V in reference)"
    reference: >-
      TF1 micro-SD socket powered from VCC3V3_SD. SDMMC_CLK has R16 22R series. SDMMC_DET via R54 100R to socket CD2.
      Card power switch Q1 SI2301CDS-T1-E3 P-MOSFET from VCC_3V3, gate pulled up by R51 100K, driven by net SDMMC_PWREN
      through R55 10K; SDMMC_PWREN = pin 59 (GPIO0_A1). R52 10K bleeder + C70 100nF, C71 10uF, C72 100nF on VCC3V3_SD; R50 bypass footprint.
