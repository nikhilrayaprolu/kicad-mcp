    supplies: {ETH_AVDD3V3: 101, "OTP_AVDD1V8/ETH_AVDD1V8/TSADC_AVDD1V8": 96}
    bias_resistor: "ETH_EXTR (pin 102, net FEPHY_REXT) -> R7 6.04K 1% to GND"   # src: Luckfox-Pico-Pro-Max.pdf#p1 @246-257,524-525
